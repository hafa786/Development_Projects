name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
      - run: python -m tests.smoke
      - run: docker build -t rag-service:test .
