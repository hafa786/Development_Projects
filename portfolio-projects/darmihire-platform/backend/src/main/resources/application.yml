spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  application:
    name: darmihire-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/darmihire}
    username: ${DB_USERNAME:darmihire}
    password: ${DB_PASSWORD:darmihire}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

darmihire:
  storage:
    resume:
      location: ${DARMIHIRE_RESUME_STORAGE:./uploads/resumes}
  email:
    provider: ${DARMIHIRE_EMAIL_PROVIDER:logging}
    from-address: ${DARMIHIRE_EMAIL_FROM:no-reply@darmihire.com}
    from-name: ${DARMIHIRE_EMAIL_FROM_NAME:DarmiHire}
    reply-to: ${DARMIHIRE_EMAIL_REPLY_TO:}
    frontend-url: ${DARMIHIRE_FRONTEND_URL:http://localhost:5173}
  notification:
    worker-delay-ms: ${NOTIFICATION_WORKER_DELAY_MS:5000}
    recovery-delay-ms: ${NOTIFICATION_RECOVERY_DELAY_MS:60000}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
    access-token-expiration: 900000

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

springdoc:

  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  show-actuator: false