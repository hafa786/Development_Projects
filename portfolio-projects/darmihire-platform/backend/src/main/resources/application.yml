spring:

  application:
    name: darmihire-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/darmihire}
    username: ${DB_USERNAME:darmihire}
    password: ${DB_PASSWORD:darmihire}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
    access-token-expiration: 900000
    
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

springdoc:

  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  show-actuator: false